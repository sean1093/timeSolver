name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a branch or PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every gate, once, on the development Node version. Ordered cheapest first so
  # a formatting slip does not burn a full build before it reports.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Zero dependencies and no build output, so it belongs with the cheap
      # gates: relative links, heading anchors, fence languages, and the
      # absolute-in-README, relative-in-docs convention. External URLs are
      # never fetched.
      - name: Check documentation links
        run: npm run check:docs

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build distributables
        run: npm run build

      - name: Validate published entry points
        run: npm run check:exports

      # attw and publint prove the published types resolve. This proves the
      # published shape has not moved: a widened parameter, a dropped overload
      # or a renamed exported type is invisible to every other gate here.
      - name: Check the public API surface
        run: npm run check:api

      - name: Enforce bundle size budget
        run: npm run size

      - name: Smoke-test built bundles
        run: npm run smoke

      # The unit suite pins TZ, so it never leaves one zone. This checks
      # invariants across seven, including one whose clocks jump at midnight
      # and three whose offsets are not whole hours.
      - name: Check zone invariants
        run: npm run test:zones

      # Two suites need the build. The gate tests drive each release gate
      # against fixture packages cut from dist/, proving it still fails when it
      # should rather than passing everything. The format fuzzer's pathological
      # cases run in child processes with a wall-clock limit, because a
      # backtracking regular expression is synchronous -- no in-process timeout
      # can interrupt one, so a runaway would hang the suite instead of failing
      # it. Both skip in the coverage run above, where dist/ does not exist yet.
      - name: Test against the built bundles
        run: npm run test:built

      # Runs even when a later gate failed, provided coverage was produced.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Proves the built ESM, CJS and IIFE bundles load on every supported runtime,
  # not just the one that built them. A date library is sensitive to the host
  # platform's time zone database and ICU build, so the newest supported Node
  # also runs on Windows and macOS.
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24, 26]
        include:
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build distributables
        run: npm run build

      - name: Smoke-test built bundles
        run: npm run smoke

      - name: Check zone invariants
        run: npm run test:zones
