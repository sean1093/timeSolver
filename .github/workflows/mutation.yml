name: Mutation

# Mutation testing asks a different question from coverage: not "did this line
# run" but "would a test have failed had this line been wrong". A full run takes
# about a minute locally and rather longer on a shared runner, which is too slow
# for every pull request, so it runs weekly and on demand.
on:
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails when the score drops below the configured threshold. Every mutant
      # that cannot be killed carries a `Stryker disable` comment naming why, so
      # a new survivor means either a missing test or a reason worth writing
      # down -- both of which want a human decision.
      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() && hashFiles('reports/mutation/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
